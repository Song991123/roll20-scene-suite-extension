<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Roll20 Scene Suite 확장 버전 설치 코드 만들기"
    />
    <title>Scene Suite 확장 버전</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='black'/%3E%3Ctext x='32' y='40' text-anchor='middle' font-family='Arial' font-size='24' font-weight='700' fill='white'%3ESS%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="assets/styles.css" />
    <script src="assets/app.js" defer></script>
  </head>
  <body>
    <header>
      <strong>Scene Suite 확장 버전</strong>
      <a href="https://x.com/EOOOOORK" target="_blank" rel="noreferrer"
        >@EOOOOORK</a
      >
    </header>

    <main>
      <section class="intro">
        <h1>Roll20 적용 코드 만들기</h1>
        <p>사용할 기능을 고르면 Roll20에 붙여 넣을 코드 한 개로 묶어줍니다.</p>
      </section>

      <section aria-labelledby="modules-title">
        <div class="section-title">
          <h2 id="modules-title">적용시킬 코드</h2>
          <div class="list-actions">
            <button type="button" id="select-all">전체 선택</button>
            <button type="button" id="clear-selection">선택 해제</button>
          </div>
        </div>
        <div class="module-list" id="module-list"></div>
      </section>

      <section aria-labelledby="settings-title">
        <div class="section-title">
          <h2 id="settings-title">사용자 설정</h2>
        </div>
        <div class="settings">
          <label id="page-setting">
            <span>적용시킬 페이지 이름</span>
            <input
              id="setting-page"
              type="text"
              value="conversation"
              autocomplete="off"
            />
          </label>
          <label id="dialog-image-setting">
            <span>대사창 이미지 주소</span>
            <input
              id="setting-dialog-image"
              type="url"
              placeholder="05번 대사창에 쓸 이미지"
              autocomplete="off"
            />
          </label>
          <p id="no-settings">선택한 코드에는 바꿀 설정이 없습니다.</p>
        </div>
      </section>

      <section class="build" aria-labelledby="build-title">
        <div>
          <h2 id="build-title">통합 파일</h2>
          <p id="build-summary"></p>
        </div>
        <div class="build-actions">
          <button type="button" id="copy-bundle">코드 복사</button>
          <button type="button" id="download-bundle">파일 받기</button>
        </div>
        <p id="build-status" role="status" aria-live="polite"></p>
      </section>

      <section aria-labelledby="setup-title">
        <div class="section-title">
          <h2 id="setup-title">세팅법</h2>
        </div>
        <div class="setup-list" id="setup-list"></div>
      </section>

      <aside class="notice">
        01 Narrator, 03 Visual Dialogue, 04 Image Switcher는 양천일염님의 원본을
        수정한 확장 버전입니다.
        <a
          href="https://github.com/kibkibe/roll20-api-scripts/wiki/API-%EC%8A%A4%ED%81%AC%EB%A6%BD%ED%8A%B8-%EA%B0%80%EA%B3%B5-%EB%B0%8F-%EC%9E%AC%EB%B0%B0%ED%8F%AC-%EC%A0%95%EC%B1%85"
          target="_blank"
          rel="noreferrer"
          >재배포 정책</a
        >에 따라 CC BY-NC 조건으로 배포합니다.
      </aside>
    </main>

    <footer>
      <a
        href="https://x.com/EOOOOORK/status/2089133134201995610"
        target="_blank"
        rel="noreferrer"
        >제작 기록</a
      >
      <a
        href="https://github.com/kibkibe/roll20-api-scripts"
        target="_blank"
        rel="noreferrer"
        >원본 출처</a
      >
    </footer>
  </body>
</html>
