<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="양천일염님의 Narrator와 Visual Dialogue를 확장한 Roll20 Scene Suite 설치 도구"
    />
    <title>Scene Suite | Narrator와 Visual Dialogue 확장판</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="assets/styles.css" />
    <script src="assets/app.js" defer></script>
  </head>
  <body>
    <header>
      <div class="site-title">
        <strong>Scene Suite</strong>
        <span>양천일염님의 Narrator와 Visual Dialogue 확장판</span>
      </div>
      <a href="https://x.com/EOOOOORK" target="_blank" rel="noreferrer"
        >@EOOOOORK</a
      >
    </header>

    <main>
      <section aria-labelledby="modules-title">
        <div class="section-title">
          <h1 id="modules-title">적용시킬 코드</h1>
          <div class="list-actions">
            <button type="button" id="select-all">전체 선택</button>
            <button type="button" id="clear-selection">선택 해제</button>
          </div>
        </div>
        <div class="module-list" id="module-list"></div>
      </section>

      <div class="build">
        <div class="build-actions">
          <button type="button" id="copy-bundle">코드 복사</button>
          <button type="button" id="download-bundle">파일 받기</button>
        </div>
        <p id="build-status" role="status" aria-live="polite"></p>
      </div>

      <aside class="notice">
        01 Narrator, 03 Visual Dialogue, 04 Image Switcher는 양천일염님의 원본을
        수정한 확장 버전입니다.
        <a
          href="https://github.com/kibkibe/roll20-api-scripts/wiki/API-%EC%8A%A4%ED%81%AC%EB%A6%BD%ED%8A%B8-%EA%B0%80%EA%B3%B5-%EB%B0%8F-%EC%9E%AC%EB%B0%B0%ED%8F%AC-%EC%A0%95%EC%B1%85"
          target="_blank"
          rel="noreferrer"
          >재배포 정책</a
        >에 따라 CC BY-NC 조건으로 배포합니다. <br />08 Cutin은
        <a
          href="https://lise1415622.tistory.com/52"
          target="_blank"
          rel="noreferrer"
          >젠트의 주사위 판정 컷인</a
        >과
        <a
          href="https://www.postype.com/@ttospt/post/21806654"
          target="_blank"
          rel="noreferrer"
          >똣의 범용 컷인 API</a
        >에서 연출 아이디어의 영향을 받아 별도 구현했습니다.
      </aside>
    </main>

    <footer>
      <a
        href="https://x.com/EOOOOORK/status/2089133134201995610"
        target="_blank"
        rel="noreferrer"
        >제작 기록</a
      >
      <a
        href="https://github.com/kibkibe/roll20-api-scripts"
        target="_blank"
        rel="noreferrer"
        >원본 출처</a
      >
    </footer>
  </body>
</html>
